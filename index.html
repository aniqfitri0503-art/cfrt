<title>EDUVERSE 21</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: sticky top bar, scrollable journey rail, one focused module column. Signature motif: two "beat" bars (2 harakat = 2 ketukan). */
:root{
  --bg:#F1F7F6; --surface:#FFFFFF; --surface2:#E3F0EE; --ink:#0F2F2C; --muted:#44605D; --line:#C6DAD7;
  --brand:#0B6B63; --brand-ink:#FFFFFF; --sun:#FFC83D; --sun-ink:#33260A;
  --ok:#17794A; --ok-bg:#DDF3E6; --bad:#B8303F; --bad-bg:#FBE3E6;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-ar:'Amiri','Scheherazade New','Traditional Arabic',serif;
  --r:18px; --shadow:0 6px 20px rgba(15,47,44,.09);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1C1B; --surface:#112A28; --surface2:#173533; --ink:#E7F3F1; --muted:#A3C0BC; --line:#2A4A47;
  --brand:#4FD1C0; --brand-ink:#04211E; --sun:#FFCB47; --sun-ink:#2E2200;
  --ok:#58D68D; --ok-bg:#12382A; --bad:#FF8A95; --bad-bg:#3D1C22; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1C1B; --surface:#112A28; --surface2:#173533; --ink:#E7F3F1; --muted:#A3C0BC; --line:#2A4A47;
  --brand:#4FD1C0; --brand-ink:#04211E; --sun:#FFCB47; --sun-ink:#2E2200;
  --ok:#58D68D; --ok-bg:#12382A; --bad:#FF8A95; --bad-bg:#3D1C22; --shadow:0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1060px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0 0 .5em;text-wrap:balance}
h1{font-size:clamp(1.9rem,4.5vw,2.9rem);font-weight:800}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0 0 .8em}
a{color:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.center{text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.ar{font-family:var(--f-ar);font-size:1.45em;line-height:1.9;direction:rtl;unicode-bidi:isolate;display:inline-block}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
svg.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto}
.logo b{font-family:var(--f-display);font-size:1.35rem;font-weight:800;letter-spacing:.01em}
.logo small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--surface2);color:var(--ink);font-weight:700;font-size:.88rem}
.chip.sun{background:var(--sun);color:var(--sun-ink)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.top-prog{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.rail{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 12px;scrollbar-width:thin}
.rail a{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700;font-size:.9rem;min-height:44px}
.rail a .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface2);font-size:.8rem}
.rail a.done .n{background:var(--ok);color:var(--brand-ink)}
.rail a[aria-current=page]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.rail a[aria-current=page] .n{background:var(--sun);color:var(--sun-ink)}

/* page head */
.assure{display:inline-flex;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.instr{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface2);margin-block:6px 18px}
.instr svg{color:var(--brand);margin-top:3px}
.instr p{margin:0}

/* cards, buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.panel{background:var(--surface2);border-radius:var(--r);padding:18px;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.grid3>*{min-width:0}
.btn{font:inherit;font-weight:700;border:2px solid transparent;border-radius:14px;padding:11px 20px;min-height:46px;cursor:pointer;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;color:var(--brand);border-color:var(--brand)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-block:14px 18px}
.tab{font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tab .ck{color:var(--ok)}
.tab[aria-selected=true] .ck{color:var(--sun)}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;padding-block:10px 24px}
.hero>*{min-width:0}
.eyebrow{font-weight:700;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
.tagline{font-family:var(--f-display);font-weight:700;color:var(--brand);font-size:1.15rem;margin-bottom:.6em}
.msg-box{border-left:6px solid var(--sun);padding:6px 0 6px 16px;margin-block:18px;font-size:1.08rem}
.bigidea{font-size:.95rem;color:var(--muted)}
.beatcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:26px 22px;box-shadow:var(--shadow);text-align:center}
.beatcard .ar{font-size:4.2rem;line-height:1.6}
.beats{display:flex;gap:8px}
.beat{flex:1;height:16px;border-radius:99px;background:var(--surface2);position:relative;overflow:hidden}
.beat::after{content:"";position:absolute;inset:0;background:var(--sun);transform:scaleX(0);transform-origin:left}
.run .beat::after{animation:fill 1.2s ease-out infinite}
.run .beat:nth-child(2)::after{animation-delay:.6s}
@keyframes fill{0%{transform:scaleX(0)}45%,100%{transform:scaleX(1)}}
.beatlab{display:flex;gap:8px;margin-top:4px;font-weight:700;color:var(--muted)}
.beatlab span{flex:1;text-align:center}
@media(max-width:760px){.hero{grid-template-columns:1fr}}

/* journey list */
.journey{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.journey li a{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);text-decoration:none;color:var(--ink);height:100%}
.journey .n{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:800}
.journey li.done .n{background:var(--ok)}
.journey b{display:block}
.journey span.d{font-size:.88rem;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.pick{font:inherit;font-weight:700;padding:9px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
.pick[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* accordion / notes */
.acc{border:1.5px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.acc+.acc{margin-top:10px}
.acc>button{font:inherit;font-weight:700;width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 16px;background:transparent;color:var(--ink);border:0;cursor:pointer;min-height:52px}
.acc .body{padding:0 16px 16px}
.kw{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.eg{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin-top:8px}

/* infographic */
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.wordbig{font-family:var(--f-ar);font-size:4rem;line-height:1.7;direction:rtl;text-align:center}
.wordbig .hl{background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:0 4px}
.map{width:100%;height:auto;display:block}
.map .ln path{stroke:var(--brand);stroke-width:2;fill:none}
.map .n0{fill:var(--brand)} .map .t0{fill:var(--brand-ink);font-family:var(--f-display);font-weight:700;font-size:22px}
.map .t0b{fill:var(--brand-ink);font-size:15px;font-family:var(--f-body)}
.map .n1{fill:var(--surface);stroke:var(--brand);stroke-width:2}
.map .tx{fill:var(--ink);font-family:var(--f-body);font-size:15px}
.map .tb{fill:var(--ink);font-family:var(--f-display);font-weight:700;font-size:19px}
.map .ta{fill:var(--ink);font-family:var(--f-ar);font-size:34px}
.map .ta2{fill:var(--brand);font-family:var(--f-ar);font-size:26px}

/* video */
.stage{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:22px;text-align:center}
.stage .ar{font-size:3.6rem;line-height:1.6;margin:0 10px}
.vbar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-block:14px}
.vbar i{display:block;height:100%;width:0;background:var(--brand)}
.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dot{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.dot[aria-current=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* flashcards */
.fc{perspective:1000px;max-width:520px;margin-inline:auto}
.fc-in{position:relative;min-height:230px;transform-style:preserve-3d;transition:transform .5s}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:22px;font-family:var(--f-display);font-weight:700;font-size:1.4rem;border:2px solid var(--line);cursor:pointer;width:100%;color:var(--ink);background:var(--surface)}
.fc-back{transform:rotateY(180deg);background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.fc-face .ar{font-size:1.5em}

/* match */
.mg{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}
.mg>*{min-width:0}
@media(max-width:640px){.mg{grid-template-columns:1fr}}
.chipd{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;margin:0 8px 8px 0;border-radius:12px;background:var(--sun);color:var(--sun-ink);font:inherit;font-weight:700;border:2px solid transparent;cursor:grab;min-height:46px}
.chipd[aria-pressed=true]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand)}
.slot{min-height:60px;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);width:100%;font:inherit;color:var(--ink);text-align:left;cursor:pointer;margin-bottom:10px}
.slot.over{border-color:var(--brand);background:var(--surface2)}
.slot.done{border-style:solid;border-color:var(--ok);background:var(--ok-bg);cursor:default}
.slot b{color:var(--ok)}

/* quiz */
.qh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qtext{font-size:1.2rem;font-weight:700;margin-bottom:14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;min-height:50px;margin-bottom:10px}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt .ol{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface2);font-weight:800;font-size:.9rem}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.fb{padding:12px 14px;border-radius:14px;margin-block:8px 14px}
.fb.ok{background:var(--ok-bg);border-left:6px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border-left:6px solid var(--bad)}
.fb.hint{background:var(--surface2);border-left:6px solid var(--sun)}
textarea,input[type=text]{font:inherit;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.score{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.score .big{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;background:var(--sun);color:var(--sun-ink);border-radius:20px;padding:14px 20px}
@media(max-width:520px){.score{grid-template-columns:1fr}}
.review{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.review li{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tmr{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:14px}
.tmr i{display:block;height:100%;background:var(--sun);transition:width 1s linear}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:14px 10px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.bd .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.bd.on .ico{background:var(--sun);color:var(--sun-ink)}
.bd.on{border-color:var(--sun)}
.bd small{color:var(--muted);font-size:.8rem}
.bd:not(.on){opacity:.75}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;height:min(52vh,420px);overflow:auto;padding:12px;background:var(--surface2);border-radius:var(--r)}
.msg{max-width:90%;padding:10px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.msg .src{display:block;font-size:.78rem;color:var(--muted);margin-top:6px}
.notice{padding:12px 14px;border-radius:14px;background:var(--surface);border:2px solid var(--sun);font-size:.92rem}
.chatin{display:flex;gap:8px;margin-top:10px}
.chatin input{flex:1;min-width:0}

/* cert */
.cert{border:3px solid var(--brand);border-radius:26px;padding:28px 22px;text-align:center;background:var(--surface);box-shadow:var(--shadow)}
.cert .nm{font-family:var(--f-display);font-weight:800;font-size:2rem;color:var(--brand);min-height:1.3em;overflow-wrap:anywhere}
.lockbox{opacity:.85}
.kv{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.kv div{background:var(--surface2);border-radius:14px;padding:10px 16px;min-width:110px}
.kv b{display:block;font-family:var(--f-display);font-size:1.5rem}

#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:40;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:var(--shadow);animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
footer{margin-top:40px;font-size:.85rem;color:var(--muted);text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.run .beat::after{transform:scaleX(1)}}
</style>

<div class="wrap">
  <header class="top" id="top"></header>
  <nav class="rail" id="rail" aria-label="Laluan pembelajaran"></nav>
  <main id="app"></main>
  <footer>EDUVERSE 21 · Kemajuan disimpan pada peranti ini sahaja · Maklumat daripada Cikgu AI perlu disemak dengan guru.</footer>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var ar=function(s){return '<span class="ar" lang="ar" dir="rtl">'+s+'</span>'};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};

/* ---------- konfigurasi guru ---------- */
var CONFIG={
  VIDEO_URL:'',   /* Guru: letak pautan video tambahan (https://...) di sini. Kosong = ruang belum diaktifkan. */
  AI_MODE:'rule-based' /* Cikgu AI ialah chatbot berasaskan peraturan. Belum disambungkan kepada model AI sebenar. */
};

/* ---------- ikon ---------- */
var ICONS={check:'M5 12l5 5L20 7',play:'M8 5v14l11-7z',pause:'M7 5h4v14H7zM13 5h4v14h-4z',replay:'M4 12a8 8 0 1 0 3-6.2M4 4v5h5',
 star:'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z',lock:'M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z',
 arrow:'M5 12h14M13 6l6 6-6 6',back:'M19 12H5M11 6l-6 6 6 6',vol:'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6',
 bulb:'M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z',down:'M6 9l6 6 6-6',up:'M6 15l6-6 6 6'};
var FILLED={play:1,pause:1,star:1};
function ic(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true" fill="'+(FILLED[n]?'currentColor':'none')+'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+ICONS[n]+'"/></svg>'}

/* ---------- keadaan & simpanan ---------- */
var KEY='eduverse21.v1',mem=null;
function defaults(){return {profile:{},done:{},aw:{},badges:[],obj:{},teroka:{},notes:{},flash:{},act:{},quiz:{},assess:{},path:{},pathway:null,rapid:null,asked:0,refl:null,nick:''}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r),d=defaults();for(var k in d){if(o[k]===undefined)o[k]=d[k]}return o}}catch(e){}return mem||defaults()}
var S=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=S}}

/* ---------- kandungan ---------- */
var MODS=[
 {id:'utama',t:'Utama'},{id:'objektif',t:'Objektif'},{id:'teroka',t:'Teroka'},{id:'alami',t:'Alami'},{id:'aplikasi',t:'Aplikasi'},

function save(){persist();var earned=BADGES.filter(function(b){return b.f()}).map(function(b){return b.id});
  earned.forEach(function(id){if(S.badges.indexOf(id)<0){S.badges.push(id);var b=BADGES.filter(function(x){return x.id===id})[0];toast('Lencana baharu: '+b.n);}});persist();chrome()}

function recPath(){var p=S.assess.pra;if(p){var r=p.ok/p.n;return r<0.5?'b':(r<1?'i':'a')}
  var pr=S.profile.prior;if(pr==='good')return 'a';if(pr==='some')return 'i';return 'b'}
function tagStats(log){var o={};log.forEach(function(l){var t=QB[l.id]&&QB[l.id].t;if(!t)return;var s=o[t]||(o[t]={ok:0,n:0});s.n++;if(l.ok)s.ok++});return o}

  if(q.type==='open'){

  }else{

  if(z.st==='fb'){h+='<button class="btn sun" data-a="qz-next" data-id="'+id+'" data-fk="qznext">'+(z.i+1>=n?'Lihat keputusan':'Seterusnya')+' '+ic('arrow')+'</button>'}

function qzSum(z){
  var n=z.qids.length,pct=Math.round(z.ok/n*100),ts=tagStats(z.log),c=QC[z.id];
  var good=Object.keys(ts).filter(function(k){return ts[k].ok===ts[k].n}),weak=Object.keys(ts).filter(function(k){return ts[k].ok<ts[k].n});
  var msg=pct>=90?'Hebat sekali! Anda menguasai bahagian ini.':pct>=75?'Bagus! Anda hampir menguasai semuanya.':pct>=50?'Usaha yang baik! Baca semula nota dan cuba lagi.':'Anda sudah bermula, dan itu penting. Lihat nota atau tanya Cikgu AI, kemudian cuba lagi.';
  var wrong=z.log.filter(function(l){return !l.ok&&QB[l.id].o});
  return '<div class="card"><h3>'+c.title+': keputusan</h3><div class="score"><div class="big">'+z.ok+'/'+n+'</div><div><p><b>'+msg+'</b></p><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div><p class="small muted" style="margin-top:6px">'+pct+'% betul</p></div></div>'+
   (good.length?'<p style="margin-top:14px"><b>Kekuatan anda</b></p><div class="kw">'+good.map(function(k){return '<span class="chip ok">'+ic('check')+' '+TAGS[k]+'</span>'}).join('')+'</div>':'')+
   (weak.length?'<p style="margin-top:14px"><b>Boleh dipertingkatkan</b></p><div class="kw">'+weak.map(function(k){return '<span class="chip sun">'+TAGS[k]+'</span>'}).join('')+'</div>':'')+
   (wrong.length?'<p style="margin-top:14px"><b>Belajar daripada jawapan yang belum tepat</b></p><ul class="review">'+wrong.map(function(l){var q=QB[l.id];return '<li><div>'+q.q+'</div><div style="margin-top:6px"><b>Jawapan betul:</b> '+q.o[q.a]+'</div><div class="small muted" style="margin-top:4px">'+q.e+'</div></li>'}).join('')+'</ul>':'')+
   '<div class="row" style="margin-top:18px"><button class="btn" data-a="qz-again" data-id="'+z.id+'">'+ic('replay')+' Cuba lagi</button></div></div>'}
function qzNext(z){z.i++;z.st='ask';z.tries=0;z.dis=[];z.hintOn=false;z.msg='';z.pick=null;z.good=false;

var CHAT=[],PEND=null,USED=[],HINTI=0;
var GEN_HINTS=['Cari dahulu alif, wau atau ya dalam perkataan itu.','Semak baris huruf sebelumnya: atas untuk alif, depan untuk wau, bawah untuk ya.','Lihat huruf selepas huruf mad. Ada hamzah atau sukun? Jika ada, ia bukan Mad Asli.','Jika semua syarat cukup, bacalah 2 ketukan.'];
function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s'’]/g,' ').replace(/\s+/g,' ').trim()}
function has(t,list){return list.some(function(w){return t.indexOf(w)>=0})}
var THINK='<br><em>Cuba fikir:</em> ';
function botReply(raw){
  var t=norm(raw);
  if(/\d{6,}|@|https?:/.test(raw)||has(t,['alamat rumah','nombor telefon','no telefon','nama penuh','kad pengenalan','kata laluan','password','rumah saya di'])){
    return {h:'Jangan kongsi maklumat peribadi seperti nama penuh, alamat atau nombor telefon di sini. Mari kita teruskan belajar tentang Mad Asli. Anda mahu tahu tentang apa?'}}
  if(has(t,['soalan','latihan','kuiz','quiz','uji saya'])){
    var pool=Object.keys(QB).filter(function(k){return /^q\d+$/.test(k)&&USED.indexOf(k)<0});if(!pool.length){USED=[];pool=Object.keys(QB).filter(function(k){return /^q\d+$/.test(k)})}
    var id=pool[Math.floor(Math.random()*pool.length)];USED.push(id);PEND={id:id,tries:0};var q=QB[id];
    return {h:'Cuba soalan ini:<br><b>'+q.q+'</b>',opts:q.o,qid:id}}
  if(has(t,['petunjuk','hint','tolong','bantu','tak tahu','tidak tahu'])){
    if(PEND){return {h:'<b>Petunjuk:</b> '+TAGHINT[QB[PEND.id].t]+THINK+'apa yang anda perhatikan dahulu dalam soalan itu?'}}
    var h=GEN_HINTS[HINTI%GEN_HINTS.length];HINTI++;return {h:'<b>Petunjuk '+(((HINTI-1)%GEN_HINTS.length)+1)+':</b> '+h+THINK+'adakah anda boleh cuba sendiri dahulu?'}}
  if(has(t,['terima kasih','thanks','tq'])){return {h:'Sama-sama! Teruskan berusaha. Jika ada yang tidak jelas, tanya cikgu anda juga.'}}
  if(/\b(hai|hello|hi|salam|assalamualaikum|selamat pagi|selamat petang)\b/.test(t)){return {h:'Waalaikumussalam! Saya Cikgu AI. Saya boleh membantu tentang Hukum Mad Asli. Anda mahu tanya apa?'}}
  if(has(t,['hamzah','sukun','sabdu','tasydid','bukan mad asli','jaa','جاء'])){return {h:'Jika selepas huruf mad ada <b>hamzah</b> atau <b>sukun</b> (termasuk huruf bertasydid), bacaannya bukan lagi Mad Asli. Contoh: '+ar('جَاءَ')+' ada hamzah selepas alif. Ia mad jenis lain.'+THINK+'mengapakah Mad Asli tidak boleh ada hamzah selepas huruf mad?'}}
  if(has(t,['huruf','alif','wau','ya mati','baris'])){return {h:'Ada tiga huruf mad:<br>• Alif selepas baris atas, contoh '+ar('قَالَ')+'<br>• Wau mati selepas baris depan, contoh '+ar('يَقُولُ')+'<br>• Ya mati selepas baris bawah, contoh '+ar('قِيلَ')+THINK+'bolehkah wau mati selepas baris atas menjadi huruf mad?'}}
  if(has(t,['harakat','ketukan','berapa panjang','berapa lama'])){return {h:'Mad Asli dibaca <b>2 harakat</b>. Satu harakat lebih kurang satu ketukan jari, jadi dua ketukan: satu, dua. Tidak lebih dan tidak kurang.'+THINK+'apa yang berlaku jika kita baca 6 ketukan?'}}
  if(has(t,['contoh'])){return {h:'Tiga contoh Mad Asli:<br>'+ar('قَالَ')+' (qaa-la)<br>'+ar('يَقُولُ')+' (ya-quu-lu)<br>'+ar('قِيلَ')+' (qii-la)<br>Semuanya dibaca 2 ketukan pada huruf mad.'+THINK+'cuba kenal pasti huruf mad dalam setiap perkataan.'}}
  if(has(t,['mudah','senang','ringkas','faham','terangkan','jelaskan'])){return {h:'Cara mudah: <b>ketuk meja dua kali</b> semasa menyebut bunyi panjang. Jika ada alif selepas baris atas, wau mati selepas baris depan atau ya mati selepas baris bawah, panjangkan bunyi itu dua ketukan sahaja.'+THINK+'bolehkah anda ketuk dua kali sambil menyebut “qaa”?'}}
  if(has(t,['thabi','nama lain'])){return {h:'Mad Asli juga dipanggil <b>Mad Thabi\'i</b>.'+THINK+'mengapakah agaknya ia dipanggil “asli”?'}}
  if(has(t,['mengapa','kenapa','sebab'])){return {h:'Soalan yang baik! Mad Asli dipanggil “asli” kerana panjangnya tetap 2 harakat dan tidak bergantung pada sebab lain seperti hamzah atau sukun.'+THINK+'jika ada hamzah selepas huruf mad, apa yang berubah?'}}
  if(has(t,['mad','asli','tajwid'])){return {h:'Mad Asli ialah bacaan yang dipanjangkan <b>2 harakat</b> (2 ketukan). Ia berlaku bila ada huruf mad (alif, wau mati atau ya mati) dan tiada hamzah atau sukun selepasnya.'+THINK+'dapatkah anda sebut tiga huruf mad?'}}
  return {h:'Saya hanya boleh membantu tentang Hukum Mad Asli. Untuk topik lain, sila tanya cikgu anda. Cuba tekan salah satu butang cadangan di atas.'}
}
function chatPush(who,html,extra){CHAT.push({w:who,h:html,x:extra||null});chatDraw()}
function chatDraw(){
  var el=$('#chatlog');if(!el)return;
  el.innerHTML=CHAT.map(function(m){
    if(m.w==='me')return '<div class="msg me">'+m.h+'</div>';
    return '<div class="msg">'+m.h+(m.x&&m.x.opts?'<div style="margin-top:10px">'+m.x.opts.map(function(o,k){return '<button class="opt" data-a="chat-pick" data-q="'+m.x.qid+'" data-k="'+k+'"><span class="ol">'+'ABCD'.charAt(k)+'</span><span>'+o+'</span></button>'}).join('')+'</div>':'')+'<span class="src">Cikgu AI (mod peraturan). Semak dengan guru.</span></div>'}).join('');
  el.scrollTop=el.scrollHeight;
}
function chatSend(text){
  text=(text||'').trim();if(!text)return;
  if(text.length>200)text=text.slice(0,200);
  var r=botReply(text);var safe=r.h.indexOf('Jangan kongsi maklumat peribadi')===0;
  CHAT.push({w:'me',h:safe?'<em>(mesej tidak dipaparkan kerana mungkin mengandungi maklumat peribadi)</em>':esc(text)});
  S.asked++;save();award('ai',10);
  chatPush('bot',r.h,r.opts?{opts:r.opts,qid:r.qid}:null);
}

VIEWS.taksir={
 html:function(){
  function card(k,l){var a=S.assess[k],p=a?Math.round(a.ok/a.n*100):0;return '<div class="card"><span class="assure">'+l+'</span><div class="row" style="justify-content:space-between"><b style="font-family:var(--f-display);font-size:1.8rem">'+(a?a.ok+'/'+a.n:'–')+'</b>'+(a?'<span class="chip '+(p>=75?'ok':'sun')+'">'+p+'%</span>':'<span class="chip">Belum dibuat</span>')+'</div><div class="bar" style="margin-top:8px" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'"><i style="width:'+p+'%"></i></div></div>'}
  var pr=S.assess.pra,po=S.assess.pasca,cmp='';

  return '<div class="grid3">'+card('pra','Pra-Penilaian')+card('form','Formatif')+card('pasca','Pasca-Penilaian')+'</div>'+cmp+

 init:function(){qzDraw(UI.as)}
};
VIEWS.refleksi={

     (r.q1?'<p><b>Yang paling menarik:</b> '+esc(r.q1)+'</p>':'')+(r.q2?'<p><b>Yang saya mahu cuba lagi:</b> '+esc(r.q2)+'</p>':'')+
     '<div class="fb ok"><b>Syabas!</b> Anda telah menamatkan perjalanan ini. Teruskan membaca dengan tekun dan sentiasa minta bimbingan guru.</div><div class="row"><button class="btn ghost" data-a="rf-edit">Ubah refleksi</button><a class="btn sun" href="#tamat">Lihat pencapaian '+ic('arrow')+'</a></div></div><div style="margin-top:18px">'+pts+'</div>'}
  return '<form id="rf" class="card stack" novalidate><fieldset style="border:0;padding:0;margin:0"><legend><b>1. Apa yang telah saya belajar?</b></legend>'+LEARNED.map(function(x,i){return '<label style="display:flex;gap:10px;align-items:flex-start;margin-top:8px;min-height:36px"><input type="checkbox" name="learned" value="'+i+'" style="width:22px;height:22px;margin-top:2px"> <span>'+x+'</span></label>'}).join('')+'</fieldset>'+
   '<fieldset style="border:0;padding:0;margin:0"><legend><b>2. Tahap kefahaman saya</b></legend><div class="opts" style="margin-top:8px">'+['Perlu bantuan','Hampir faham','Faham','Boleh ajar kawan'].map(function(x,i){return '<label class="pick" style="display:inline-flex;gap:8px;align-items:center"><input type="radio" name="level" value="'+(i+1)+'"> '+x+'</label>'}).join('')+'</div></fieldset>'+
   '<fieldset style="border:0;padding:0;margin:0"><legend><b>3. Konsep yang masih sukar</b></legend><div class="opts" style="margin-top:8px">'+Object.keys(TAGS).map(function(k){return '<label class="pick" style="display:inline-flex;gap:8px;align-items:center"><input type="checkbox" name="hard" value="'+k+'"> '+TAGS[k]+'</label>'}).join('')+'</div></fieldset>'+
   '<div><label for="q1"><b>4. Apa yang paling menarik hari ini?</b></label><textarea id="q1" name="q1" rows="2" maxlength="300"></textarea></div>'+
   '<div><label for="q2"><b>5. Apa yang saya mahu cuba lagi?</b></label><textarea id="q2" name="q2" rows="2" maxlength="300"></textarea><p class="small muted" style="margin:6px 0 0">Jangan tulis nama penuh, alamat atau nombor telefon.</p></div>'+
   '<fieldset style="border:0;padding:0;margin:0"><legend><b>6. Bantu cikgu memperbaiki bahan ini.</b> Adakah bahan ini mudah difahami?</legend><div class="opts" style="margin-top:8px">'+[['ya','Ya'],['sedikit','Sedikit'],['belum','Belum']].map(function(x){return '<label class="pick" style="display:inline-flex;gap:8px;align-items:center"><input type="radio" name="fbm" value="'+x[0]+'"> '+x[1]+'</label>'}).join('')+'</div></fieldset>'+
   '<p id="rf-err" class="fb bad" role="alert" hidden>Pilih tahap kefahaman anda dahulu.</p><div><button class="btn sun" type="submit">Hantar refleksi</button></div></form><div style="margin-top:18px">'+pts+'</div>'}
};

};

/* ---------- pengendali acara ---------- */
var H={};
H.start=function(){if(!S.done.start){S.done.start=true;award('start',5)}};
H.prof=function(t){S.profile[t.dataset.k]=t.dataset.v;if(t.dataset.k==='pref')UI.tk=null;save();draw()};
H.tab=function(t){UI[t.dataset.g]=t.dataset.v;draw()};
H['obj-open']=function(t){var k='ob'+t.dataset.v;UI[k]=!UI[k];draw()};
H['obj-ok']=function(t){S.obj[t.dataset.v]=true;award('obj'+t.dataset.v,5);draw()};
H.note=function(t){var i=+t.dataset.v;UI.no=UI.no===i?-1:i;if(UI.no===i&&!S.notes[i]){S.notes[i]=true;award('n'+i,2);if(Object.keys(S.notes).length===NOTES.length&&!S.teroka.nota){S.teroka.nota=true;award('t-nota',5);save()}}draw()};
H['info-go']=function(t){UI.is=+t.dataset.v;if(UI.is===3&&!S.teroka.info){S.teroka.info=true;award('t-info',10)}draw()};
H['vid-toggle']=function(){if(VID.play){vidStop()}else{if(VID.i===SC.length-1&&VID.t>=SC_MS){VID.i=0;VID.t=0}vidStart()}vidDraw()};
H['vid-restart']=function(){vidStop();VID.i=0;VID.t=0;VID.q=null;vidDraw()};
H['vid-go']=function(t){vidStop();VID.i=+t.dataset.v;VID.t=0;VID.q=null;vidDraw()};
H['vid-ans']=function(t){if(!VID.q||VID.q.k!==null)return;VID.q.k=+t.dataset.k;VID.asked[VID.q.i]=true;
  if(SC.every(function(s,i){return !s.q||VID.asked[i]})&&!S.teroka.video){S.teroka.video=true;award('t-video',15)}vidDraw()};
H['vid-cont']=function(){VID.q=null;if(VID.i<SC.length-1){VID.i++;VID.t=0;vidStart()}else{VID.t=SC_MS}vidDraw()};
H['aud-play']=function(t){audSpeak(+t.dataset.v)};
H['aud-pause']=function(){if(hasTTS())window.speechSynthesis.pause();AUD.st='pause';audDraw()};
H['aud-resume']=function(){if(hasTTS())window.speechSynthesis.resume();AUD.st='play';audDraw()};
H['aud-replay']=function(t){audSpeak(+t.dataset.v)};
H['fc-flip']=function(){var c=$('#fcard');if(!c)return;c.classList.toggle('flip');if(!S.flash[UI.fc]){S.flash[UI.fc]=true;var p=$('#fcprog');if(p)p.textContent='Kad dibalik: '+Object.keys(S.flash).length+' / '+FC.length;
  if(Object.keys(S.flash).length===FC.length&&!S.teroka.flash){S.teroka.flash=true;award('t-flash',15)}else save()}};
H['fc-go']=function(t){UI.fc=(UI.fc+(+t.dataset.v)+FC.length)%FC.length;fcDraw();var b=$('[data-fk="fcf"]');if(b)b.focus({preventScroll:true})};
H['mt-chip']=function(t){MT.sel=(MT.sel===+t.dataset.c)?null:+t.dataset.c;mtDraw()};
H['mt-slot']=function(t){if(MT.sel===null){MT.msg='Pilih satu konsep dahulu, kemudian ketik definisi.';mtDraw();return}mtTry(MT.sel,+t.dataset.s)};
H['mt-reset']=function(){mtInit();mtDraw()};
H['qz-go']=function(t){qzStart(t.dataset.id)};
H['qz-again']=function(t){qzStart(t.dataset.id)};
H['qz-hint']=function(t){var z=QZ[t.dataset.id];z.hintOn=true;z.hu++;qzDraw(z.id)};
H['qz-pick']=function(t){
  var z=QZ[t.dataset.id],k=+t.dataset.k,q=QB[z.qids[z.i]];if(!z||z.st!=='ask'||z.dis.indexOf(k)>=0)return;
  if(k===q.a){z.ok++;z.log.push({id:z.qids[z.i],ok:true});z.st='fb';z.pick=k;z.good=true;z.msg='<b>'+(z.tries?'Bagus, anda berjaya!':'Betul!')+'</b> '+q.e}
  else if(z.retry&&z.tries<1){z.tries++;z.dis.push(k);z.hintOn=true;z.msg='<b>Belum tepat, tidak mengapa.</b> Baca petunjuk dan cuba lagi.'}
  else{z.log.push({id:z.qids[z.i],ok:false});z.st='fb';z.pick=k;z.good=false;z.msg='<b>Hampir!</b> '+q.e}
  qzDraw(z.id)};
H['qz-open']=function(t){var z=QZ[t.dataset.id],q=QB[z.qids[z.i]],ta=document.getElementById('qo-'+z.id),v=ta?ta.value.trim():'';
  if(v.length<10){z.msg='Tulis sekurang-kurangnya satu ayat.';qzDraw(z.id);var n=document.getElementById('qo-'+z.id);if(n){n.value=v;n.focus()}return}
  z.ok++;z.log.push({id:z.qids[z.i],ok:true});z.st='fb';z.good=true;z.msg='<b>Terima kasih!</b> '+q.fbk;qzDraw(z.id)};
H['qz-next']=function(t){var z=QZ[t.dataset.id];qzNext(z);qzDraw(z.id);save()};
H['rc-start']=function(){rcClear();RC={i:0,streak:0,pts:0,right:0,st:'ask',left:12,tm:null};rcAsk()};
H['rc-ans']=function(t){rcAnswer(+t.dataset.v)};
H['rc-next']=function(){rcNext()};
H.path=function(t){S.pathway=t.dataset.v;save();draw()};
H.demo=function(){var d=$('#demo');if(!d)return;d.classList.add('run');setTimeout(function(){d.classList.remove('run')},3600)};
H['chat-send']=function(){var i=$('#chat-in');if(i){var v=i.value;i.value='';chatSend(v);i.focus()}};
H['chat-chip']=function(t){chatSend(t.dataset.v)};
H['chat-pick']=function(t){
  var id=t.dataset.q,k=+t.dataset.k;if(!PEND||PEND.id!==id){chatPush('bot','Tekan “Beri soalan latihan” untuk soalan baharu.');return}
  var q=QB[id];CHAT.push({w:'me',h:'Jawapan saya: '+q.o[k]});
  if(k===q.a){PEND=null;chatPush('bot','<b>Betul!</b> '+q.e+THINK+'bolehkah anda beri satu contoh lain?')}
  else if(PEND.tries<1){PEND.tries++;chatPush('bot','Hampir! <b>Petunjuk:</b> '+TAGHINT[q.t]+' Cuba lagi.')}
  else{PEND=null;chatPush('bot','Tidak mengapa. '+q.e+' Cuba soalan lain bila anda sedia.')}};
H['rf-edit']=function(){S.refl=null;save();draw()};
H.goquiz=function(){UI.al='B'};
H['reset-ask']=function(){UI.rs=true;draw()};
H['reset-no']=function(){UI.rs=false;draw()};
H['reset-yes']=function(){UI.rs=false;try{localStorage.removeItem(KEY)}catch(e){}mem=null;S=defaults();CHAT=[];PEND=null;QZ={};MT=null;RC=null;UI.tk=null;UI.no=-1;UI.is=0;UI.fc=0;UI.al='A';UI.as='pra';VID={i:0,t:0,play:false,asked:{},q:null,tm:null};AUD={cur:-1,st:'idle'};
  if(location.hash==='#utama'||!location.hash)route();else location.hash='#utama'};

var app=$('#app');
app.addEventListener('click',function(e){var t=e.target.closest('[data-a]');if(!t||t.disabled)return;var f=H[t.dataset.a];if(f)f(t,e)});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='chat-in'){e.preventDefault();H['chat-send']()}});
app.addEventListener('input',function(e){if(e.target.id==='nick'){S.nick=e.target.value.slice(0,20);persist();var n=$('#nm');if(n)n.textContent=S.nick||'Peneroka Ilmu'}});
app.addEventListener('submit',function(e){
  e.preventDefault();if(e.target.id!=='rf')return;
  var f=e.target,lv=f.querySelector('input[name=level]:checked'),err=$('#rf-err');
  if(!lv){err.hidden=false;err.scrollIntoView({block:'center'});return}
  var fbm=f.querySelector('input[name=fbm]:checked');
  S.refl={level:+lv.value,learned:$$('input[name=learned]:checked',f).map(function(x){return +x.value}),hard:$$('input[name=hard]:checked',f).map(function(x){return x.value}),q1:f.querySelector('[name=q1]').value.trim().slice(0,300),q2:f.querySelector('[name=q2]').value.trim().slice(0,300),fb:fbm?fbm.value:null};
  award('refl',20);save();draw();window.scrollTo(0,0)});
/* seret dan lepas (papar kekunci dan sentuhan guna ketik-pilih) */
app.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('.chipd');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.c);e.dataTransfer.effectAllowed='move';MT.sel=null});
app.addEventListener('dragover',function(e){var s=e.target.closest&&e.target.closest('.slot');if(s&&!s.disabled){e.preventDefault();s.classList.add('over')}});
app.addEventListener('dragleave',function(e){var s=e.target.closest&&e.target.closest('.slot');if(s)s.classList.remove('over')});
app.addEventListener('drop',function(e){var s=e.target.closest&&e.target.closest('.slot');if(!s||s.disabled)return;e.preventDefault();var c=e.dataTransfer.getData('text/plain');if(c!=='')mtTry(+c,+s.dataset.s)});
window.addEventListener('hashchange',route);
if(hasTTS()&&window.speechSynthesis.getVoices)window.speechSynthesis.getVoices();
route();
})();
</script>
